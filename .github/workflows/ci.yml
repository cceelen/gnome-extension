# Checks every pull request. The ruleset of main requires these checks and
# a branch that is up to date, so the tree that a merge puts on main is the
# tree that the pull request run checked: a push to main runs nothing here.
#
# Once a week the checks run on main: for what changes without a commit (a
# new GNOME Shell in the images, new lints).
name: ci

on:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# A newer push to the same branch or pull request makes the older run
# pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The tests of the logic and of the zips, with the coverage of the modules
  # that the tests load. extension.js, display.js and sensor.js need a GNOME
  # Shell: the shell job loads them.
  js:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          sudo apt-get update -q && sudo apt-get install -qy --no-install-recommends
          libglib2.0-bin zip unzip
      - run: |
          node --test --experimental-test-coverage --test-coverage-exclude='**/tests/**' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=js.lcov \
            gnome-*/tests/*.test.js tests/*.test.js | tee js.txt
          {
            echo '### Coverage'
            echo '```text'
            sed -n '/start of coverage report/,/end of coverage report/p' js.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-js
          path: js.lcov
          retention-days: 7
      - run: |
          build-aux/pack.sh gnome-keys dist
          build-aux/pack.sh gnome-rotation dist
      # The checks that extensions.gnome.org makes on an upload: an error
      # there holds the review, so it fails here first.
      - run: |
          python3 -m venv "$RUNNER_TEMP/shexli"
          "$RUNNER_TEMP/shexli/bin/pip" install -q --require-hashes -r tests/ego/requirements.txt
          status=0
          for z in dist/*.zip; do
            "$RUNNER_TEMP/shexli/bin/shexli" --format json "$z" > shexli.json
            jq -r --arg z "$z" '.findings[] |
              "::\(if .severity == "error" then "error" else "warning" end) title=\(.rule_id)::\($z): \(.message)"' shexli.json
            jq -e '[.findings[] | select(.severity == "error")] | length == 0' shexli.json > /dev/null || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zips
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  # Each zip in a headless GNOME Shell: it must load, enable and disable with
  # no error. The images give the lowest and the highest tested GNOME Shell;
  # Renovate updates their digests.
  shell:
    # A name without the digest: the ruleset requires the check by its name,
    # and Renovate changes the digests.
    name: shell (GNOME ${{ matrix.gnome }})
    needs: js
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - gnome: "46"
            image: ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
          - gnome: "50"
            image: ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zips
          path: dist
      - run: tests/shell/container.sh dist/*.zip

  # Every hook of .pre-commit-config.yaml: formats, lints, spelling,
  # licences, one version in all files.
  pre-commit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The environments of the hooks, made again only when the
      # configuration changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pipx run pre-commit run --all-files --show-diff-on-failure

  # Secrets in every commit of the history. The gitleaks hook of the
  # pre-commit job looks at staged changes only, and a checkout has none.
  secrets:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-secrets-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pipx run pre-commit run gitleaks-history --hook-stage manual

  workflows:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true

  # The coverage of the js job goes to Codecov. It is measured, not a limit,
  # and a failed upload does not fail the run. Only this job has the token;
  # it runs nothing from the tree.
  coverage:
    needs: js
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-js
          path: coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/js.lcov
          disable_search: true
          fail_ci_if_error: false

  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # A called workflow may not ask for more permissions than its caller
  # grants. These are for its attest job, which does not run here.
  release-files:
    uses: ./.github/workflows/release-files.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
